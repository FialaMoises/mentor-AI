name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API, motor e migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mentor
          POSTGRES_PASSWORD: mentor
          POSTGRES_DB: mentor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentor -d mentor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: services/api
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos
        working-directory: services/api
        run: python -m mypy app

      - name: Testes com portão de cobertura do motor
        working-directory: services/api
        run: python -m pytest --cov=app/engine --cov-report=term-missing --cov-fail-under=90

      - name: Migrations aplicam em Postgres limpo
        env:
          DATABASE_URL: postgresql+psycopg://mentor:mentor@localhost:5432/mentor
        run: alembic -c db/alembic.ini upgrade head

      - name: Base canônica carrega em banco limpo
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://mentor:mentor@localhost:5432/mentor
        run: python -m app.catalog

      - name: Seed roda no banco migrado
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://mentor:mentor@localhost:5432/mentor
        run: python -m app.seed

  web:
    name: PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
