# Base canônica de temas do mentor-AI.
#
# Árvore de três níveis: área → tema → subtema. O `slug` é a identidade estável
# entre este arquivo e o banco: renomear `name` é seguro, trocar `slug` cria
# outro tema e descola o histórico de progresso dos alunos.
#
# O peso de um subtema é o produto dos pesos da área, do tema e dele mesmo
# (ausente = 1.0), normalizado para o maior valer 1.0. Todo peso carrega origem:
# enquanto não houver curadoria de provas anteriores, vale o peso uniforme
# declarado em `weights.default_source`.

version: 1

exam:
  slug: enamed
  name: ENAMED — Exame Nacional de Avaliação da Formação Médica
  authority: Inep/MEC
  notes: >-
    Prova objetiva de 100 questões. A nota é usada pelo ENARE no acesso direto à
    residência. A estrutura de sete áreas vem da matriz de referência do Inep.

weights:
  checked_at: 2026-09-25
  default_source: >-
    Matriz de referência do Inep (sete áreas). O ENAMED não publica distribuição
    oficial de questões por área, então todas as áreas entram com peso uniforme
    até a curadoria de provas anteriores.

