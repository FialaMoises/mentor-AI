services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentor}
      POSTGRES_DB: ${POSTGRES_DB:-mentor}
    # Sem porta publicada: a API fala com o db pela rede do compose. Para plugar um
    # cliente de banco, descomente e escolha uma porta livre no host.
    # ports:
    #   - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentor} -d ${POSTGRES_DB:-mentor}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Só para desenvolvimento: em produção o object store é S3 de verdade.
  # A MinIO tirou as imagens do Docker Hub, então vem do registro deles no
  # quay.io, com tag fixa — essa imagem não recebe mais patch, e é por isso
  # que ela não passa de dependência local.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mentor}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mentor123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-mentor-ai-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mentor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mentor123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@mentor-ai.app}
      SMTP_HOST: ${SMTP_HOST:-}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-segredo-de-teste}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mentor}:${POSTGRES_PASSWORD:-mentor}@db:5432/${POSTGRES_DB:-mentor}
      CORS_ORIGINS: http://localhost:4200
    command: >
      sh -c "alembic -c /srv/db/alembic.ini upgrade head &&
             python -m app.catalog &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./services/api/app:/srv/services/api/app
      - ./db:/srv/db
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - api
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --proxy-config proxy.conf.docker.json"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "4200:4200"

volumes:
  db-data:
  minio-data:
  web-node-modules:
